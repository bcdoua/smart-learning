ServerName localhost
ErrorLog "|$/bin/cat 1>&2"

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    ErrorLog "|$/bin/cat 1>&2"
    CustomLog "|/bin/cat" combined

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
</VirtualHost>

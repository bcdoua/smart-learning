services:
  db:
    image: mysql:8.4
    env_file: [.env.staging]
    volumes:
      - stagingdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  api:
    image: ghcr.io/bcdoua/smart-learning:${IMAGE_TAG}
    ports: ["8080:8080"]
    env_file: [.env.staging]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  stagingdata:
